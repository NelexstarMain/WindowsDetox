name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build WindowsDetox.slnx -c Release
      - name: Test (portable subset)
        if: runner.os == 'Linux'
        run: dotnet test --solution WindowsDetox.slnx -c Release --no-build --filter-not-trait "Category=WindowsOnly"
      - name: Test (all)
        if: runner.os == 'Windows'
        run: dotnet test --solution WindowsDetox.slnx -c Release --no-build
      - name: Slopwatch
        if: runner.os == 'Linux'
        run: dotnet slopwatch analyze -d . --fail-on warning
      - name: Vulnerable packages
        if: runner.os == 'Linux'
        run: dotnet list WindowsDetox.slnx package --vulnerable --include-transitive

  renders:
    # Screenshots of the real UI with fake data, rendered under Wine (see .claude/skills/ui-render/SKILL.md). A review aid, not a gate:
    # Ubuntu's Wine 9 is unverified for WPF on .NET 10 (Wine 10 works; the script runs Wine under `env -i` because a large
    # environment crashes it), so a failure here must not turn the workflow red.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Wine, Xvfb and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 xvfb python3-fonttools fonts-inter fonts-liberation fonts-jetbrains-mono fonts-dejavu-core
      - name: Render
        run: eng/render.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-renders
          path: artifacts/renders
          retention-days: 30

  installer:
    runs-on: windows-latest
    permissions:
      contents: write # commits refreshed docs/screenshots back to the branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build installer
        shell: bash
        run: eng/build-installer.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsDetox-Setup
          path: out/WindowsDetox-Setup.exe
          retention-days: 30
      - name: Screenshot installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File eng/screenshots.ps1 -Phase installer -Setup out\WindowsDetox-Setup.exe
      - name: Install (quiet) and check services
        shell: pwsh
        run: |
          $p = Start-Process out\WindowsDetox-Setup.exe -ArgumentList '--quiet' -Wait -PassThru -RedirectStandardOutput install.log -RedirectStandardError install.err
          Get-Content install.log, install.err
          if ($p.ExitCode -ne 0) { throw "install exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 10
          Get-ChildItem "$env:ProgramData\WindowsDetox\logs" -ErrorAction SilentlyContinue | Get-Content -Tail 40
          foreach ($name in 'WindowsDetoxService', 'WindowsDetoxWatchdog') {
            $svc = Get-Service $name
            "$name $($svc.Status)"
            if ($svc.Status -ne 'Running') { throw "$name is not running" }
          }
          if (-not (Test-Path "$env:ProgramFiles\WindowsDetox\Blocker.UI.exe")) { throw 'application files missing' }
          $pipes = [System.IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -like '*WindowsDetox*' }
          $pipes
          if (-not ($pipes -like '*WindowsDetox.Service')) { throw 'service pipe is not listening (see the service log above)' }
          if (Select-String -Path "$env:ProgramData\WindowsDetox\logs\*" -Pattern '\[Critical\]' -Quiet) { throw 'the service logged a critical error' }
      - name: Screenshot app
        if: always()
        continue-on-error: true
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File eng/screenshots.ps1 -Phase app -InstallDir "$env:ProgramFiles\WindowsDetox"
      - name: Commit screenshots to docs/screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated images never merge: on every attempt start from the newest remote tip and lay this run's files on top,
          # so overlapping runs (or a screenshot commit from an earlier run) cannot cause binary conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p docs/screenshots && cp shots/*.png docs/screenshots/
            # Animation frame sequences: replace the folder so frames of an older, longer recording do not linger.
            if [ -d shots/anim ]; then
              rm -rf docs/screenshots/anim
              cp -r shots/anim docs/screenshots/anim
            fi
            git add docs/screenshots
            git diff --cached --quiet && exit 0
            git commit -m "Update UI screenshots from CI [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          retention-days: 30
      - name: Uninstall (quiet) and check nothing is left
        shell: pwsh
        run: |
          Get-Process Blocker.UI, Blocker.Stub -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Start-Process "$env:ProgramFiles\WindowsDetox\Blocker.Setup.exe" -ArgumentList '--uninstall', '--quiet' -Wait -PassThru -RedirectStandardOutput uninstall.log -RedirectStandardError uninstall.err
          if ($u.ExitCode -ne 0) { throw "uninstaller launcher exit code $($u.ExitCode)" }
          # The launcher hands over to a copy in %TEMP% so the install directory can be deleted; wait for that copy.
          for ($i = 0; $i -lt 120 -and (Get-Process Blocker.Setup -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          Get-Content uninstall.log, uninstall.err
          if (Get-Process Blocker.Setup -ErrorAction SilentlyContinue) { throw 'uninstaller still running' }
          if (Test-Path "$env:ProgramFiles\WindowsDetox") { Get-ChildItem -Recurse "$env:ProgramFiles\WindowsDetox" | Select-Object -First 20 FullName; throw 'install directory left behind' }
          if (Get-Service WindowsDetoxService -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name WindowsDetoxAgent -ErrorAction SilentlyContinue) { throw 'agent autorun left behind' }
      - name: Publish the installer as the latest-build release
        # Only after the install/uninstall checks above passed, and only for pushes (not pull requests).
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd out && sha256sum WindowsDetox-Setup.exe > WindowsDetox-Setup.exe.sha256)
          notes="Installer built and install/uninstall-tested by CI from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Unsigned: Windows SmartScreen may warn (More info, Run anyway). Try it in a VM first."
          # The tag is never moved (a token may not push tags that point at commits touching workflow files);
          # the release keeps its tag and only its notes and files change on every build.
          if gh release view latest-build > /dev/null 2>&1; then
            gh release edit latest-build --title "Windows Detox (latest build)" --notes "$notes" --latest --prerelease=false
          else
            gh release create latest-build --target "$GITHUB_SHA" --title "Windows Detox (latest build)" --notes "$notes" --latest
          fi
          gh release upload latest-build out/WindowsDetox-Setup.exe out/WindowsDetox-Setup.exe.sha256 --clobber
      - name: Publish a versioned release the first time a new version is built
        # Bumping <Version> in Blocker.Setup (and Blocker.UI) is the release trigger; an existing v<Version> release is never touched.
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Blocker.Setup/Blocker.Setup.csproj | head -n 1)
          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            printf 'Windows Detox %s, built from %s at %s.\n\nUnsigned installer: Windows SmartScreen may warn (More info, Run anyway).\n' "$version" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          gh release create "$tag" out/WindowsDetox-Setup.exe out/WindowsDetox-Setup.exe.sha256 --target "$GITHUB_SHA" --title "Windows Detox $version" --notes-file "$notes" --latest
