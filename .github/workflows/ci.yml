name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build WindowsDetox.slnx -c Release
      - name: Test (portable subset)
        if: runner.os == 'Linux'
        run: dotnet test --solution WindowsDetox.slnx -c Release --no-build --filter-not-trait "Category=WindowsOnly"
      - name: Test (all)
        if: runner.os == 'Windows'
        run: dotnet test --solution WindowsDetox.slnx -c Release --no-build
      - name: Slopwatch
        if: runner.os == 'Linux'
        run: dotnet slopwatch analyze -d . --fail-on warning
      - name: Vulnerable packages
        if: runner.os == 'Linux'
        run: dotnet list WindowsDetox.slnx package --vulnerable --include-transitive

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build installer
        shell: bash
        run: eng/build-installer.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsDetox-Setup
          path: out/WindowsDetox-Setup.exe
          retention-days: 30
      - name: Screenshot installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File eng/screenshots.ps1 -Phase installer -Setup out\WindowsDetox-Setup.exe
      - name: Install (quiet) and check services
        shell: pwsh
        run: |
          $p = Start-Process out\WindowsDetox-Setup.exe -ArgumentList '--quiet' -Wait -PassThru -RedirectStandardOutput install.log -RedirectStandardError install.err
          Get-Content install.log, install.err
          if ($p.ExitCode -ne 0) { throw "install exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 10
          Get-ChildItem "$env:ProgramData\WindowsDetox\logs" -ErrorAction SilentlyContinue | Get-Content -Tail 40
          foreach ($name in 'WindowsDetoxService', 'WindowsDetoxWatchdog') {
            $svc = Get-Service $name
            "$name $($svc.Status)"
            if ($svc.Status -ne 'Running') { throw "$name is not running" }
          }
          if (-not (Test-Path "$env:ProgramFiles\WindowsDetox\Blocker.UI.exe")) { throw 'application files missing' }
          $pipes = [System.IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -like '*WindowsDetox*' }
          $pipes
          if (-not ($pipes -like '*WindowsDetox.Service')) { throw 'service pipe is not listening (see the service log above)' }
          if (Select-String -Path "$env:ProgramData\WindowsDetox\logs\*" -Pattern '\[Critical\]' -Quiet) { throw 'the service logged a critical error' }
      - name: Screenshot app
        if: always()
        continue-on-error: true
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File eng/screenshots.ps1 -Phase app -InstallDir "$env:ProgramFiles\WindowsDetox"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          retention-days: 30
      - name: Uninstall (quiet) and check nothing is left
        shell: pwsh
        run: |
          Get-Process Blocker.UI, Blocker.Stub -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Start-Process "$env:ProgramFiles\WindowsDetox\Blocker.Setup.exe" -ArgumentList '--uninstall', '--quiet' -Wait -PassThru -RedirectStandardOutput uninstall.log -RedirectStandardError uninstall.err
          if ($u.ExitCode -ne 0) { throw "uninstaller launcher exit code $($u.ExitCode)" }
          # The launcher hands over to a copy in %TEMP% so the install directory can be deleted; wait for that copy.
          for ($i = 0; $i -lt 120 -and (Get-Process Blocker.Setup -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          Get-Content uninstall.log, uninstall.err
          if (Get-Process Blocker.Setup -ErrorAction SilentlyContinue) { throw 'uninstaller still running' }
          if (Test-Path "$env:ProgramFiles\WindowsDetox") { Get-ChildItem -Recurse "$env:ProgramFiles\WindowsDetox" | Select-Object -First 20 FullName; throw 'install directory left behind' }
          if (Get-Service WindowsDetoxService -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name WindowsDetoxAgent -ErrorAction SilentlyContinue) { throw 'agent autorun left behind' }
