name: Release 1.5.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-46f6137f-d7cqi9
          fetch-depth: 0

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git rev-parse v1.5.1 >/dev/null 2>&1; then
            echo "Tag v1.5.1 already exists"
            exit 1
          fi

          git tag v1.5.1
          git push origin v1.5.1

          gh release create v1.5.1 \
            --title "Windows Detox 1.5.1" \
            --notes "Windows Detox 1.5.1" \
            --latest
